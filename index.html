<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>潘涛 · 宝可梦冒险</title>
<style>
:root{
  --bg:#f7f5f0; --paper:#fffefb; --paper-2:#faf8f3;
  --ink:#1a1815; --ink-2:#3d3833; --ink-3:#6b645c; --ink-4:#a39b91;
  --line:#e8e4dc; --line-2:#d4cec4;
  --accent:#c2410c; --accent-2:#ea580c;
  --green:#15803d; --amber:#b45309; --red:#b91c1c;
  --purple:#6d28d9;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);min-height:100vh;
  -webkit-font-smoothing:antialiased;line-height:1.6;
  background-image:
    radial-gradient(circle at 20% 10%,rgba(194,65,12,0.03),transparent 50%),
    radial-gradient(circle at 80% 90%,rgba(109,40,217,0.03),transparent 50%);
}
.app{max-width:960px;margin:0 auto;padding:28px 24px 96px;}

.topbar{display:flex;justify-content:space-between;align-items:center;padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:32px;}
.logo{display:flex;align-items:center;gap:12px;}
.logo-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:18px;box-shadow:0 4px 12px rgba(194,65,12,0.25);}
.logo-text{display:flex;flex-direction:column;line-height:1.2;}
.logo-name{font-size:16px;font-weight:900;letter-spacing:2px;}
.logo-sub{font-size:9px;color:var(--ink-4);letter-spacing:3px;font-weight:600;text-transform:uppercase;}
.topbar-stats{display:flex;gap:8px;}
.stat-pill{display:flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--line);border-radius:100px;font-size:12px;background:var(--paper);transition:all 0.2s;}
.stat-pill:hover{border-color:var(--ink);}
.stat-pill .icon{font-size:13px;}
.stat-pill b{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;}
.stat-pill .lbl{color:var(--ink-4);font-size:10px;letter-spacing:1px;text-transform:uppercase;font-weight:600;}

.screen{display:none;}
.screen.active{display:block;animation:fadeIn 0.45s cubic-bezier(0.16,1,0.3,1);}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

.hero{padding:56px 0 40px;text-align:center;}
.hero-illustration{width:120px;height:120px;margin:0 auto 28px;position:relative;display:flex;align-items:center;justify-content:center;}
.hero-illustration::before{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(194,65,12,0.12),transparent 70%);animation:pulseSlow 4s ease-in-out infinite;}
@keyframes pulseSlow{0%,100%{transform:scale(1);opacity:0.6;}50%{transform:scale(1.1);opacity:1;}}
.hero-illustration-emoji{font-size:68px;position:relative;z-index:1;animation:floatY 3s ease-in-out infinite;}
@keyframes floatY{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
.hero-sub{font-size:10px;letter-spacing:6px;color:var(--ink-4);font-weight:700;margin-bottom:16px;text-transform:uppercase;}
.hero h1{font-size:48px;font-weight:900;letter-spacing:3px;color:var(--ink);margin-bottom:16px;line-height:1.15;}
.hero h1 em{font-style:normal;color:var(--accent);}
.hero p{font-size:14px;color:var(--ink-3);letter-spacing:0.5px;max-width:420px;margin:0 auto;line-height:1.8;}
.hero-line{width:48px;height:2px;background:var(--ink);margin:32px auto 0;}

.starter-section{margin-top:56px;}
.starter-section-label{font-size:11px;letter-spacing:4px;color:var(--ink-4);text-transform:uppercase;font-weight:700;text-align:center;margin-bottom:24px;}
.starter-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.starter-card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:24px 20px 22px;text-align:center;cursor:pointer;transition:all 0.3s cubic-bezier(0.16,1,0.3,1);position:relative;overflow:hidden;}
.starter-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform 0.4s cubic-bezier(0.16,1,0.3,1);}
.starter-card:hover{transform:translateY(-6px);border-color:var(--ink);box-shadow:0 20px 40px rgba(0,0,0,0.08);}
.starter-card:hover::before{transform:scaleX(1);}
.starter-portrait{width:120px;height:120px;margin:0 auto 16px;position:relative;transition:transform 0.4s cubic-bezier(0.16,1,0.3,1);}
.starter-card:hover .starter-portrait{transform:scale(1.08) translateY(-4px);}
.starter-name{font-size:18px;font-weight:900;letter-spacing:1px;margin-bottom:6px;}
.starter-type-tag{display:inline-block;font-size:10px;letter-spacing:2px;text-transform:uppercase;font-weight:700;margin-bottom:16px;padding:2px 10px;border:1px solid var(--line-2);border-radius:100px;}
.starter-desc{font-size:12px;color:var(--ink-3);line-height:1.7;padding-top:16px;border-top:1px dashed var(--line);}
.starter-desc strong{color:var(--ink);font-weight:700;}

.main-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:16px;margin-bottom:16px;}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:26px 28px;}
.section-title{font-size:10px;letter-spacing:3px;color:var(--ink-4);text-transform:uppercase;font-weight:700;margin-bottom:20px;display:flex;align-items:center;gap:10px;}
.section-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent);}

.tao-status{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:20px;}
.status-item{text-align:center;padding:12px 6px;border:1px solid var(--line);border-radius:10px;background:var(--paper-2);}
.status-icon{font-size:18px;display:block;margin-bottom:4px;}
.status-label{font-size:9px;color:var(--ink-4);letter-spacing:2px;text-transform:uppercase;font-weight:700;margin-bottom:6px;}
.status-bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:4px;}
.status-bar-fill{height:100%;border-radius:2px;transition:width 0.5s cubic-bezier(0.16,1,0.3,1);}
.status-value{font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink);}

.team-list{display:flex;flex-direction:column;gap:8px;}
.team-member{display:flex;align-items:center;gap:14px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--paper-2);transition:all 0.25s;}
.team-member:hover{border-color:var(--ink);transform:translateX(3px);}
.tm-portrait{width:52px;height:52px;flex-shrink:0;position:relative;}
.tm-info{flex:1;min-width:0;}
.tm-name{font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;}
.tm-lv{font-size:10px;color:var(--ink-4);font-weight:700;letter-spacing:1px;font-variant-numeric:tabular-nums;}
.tm-bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;}
.tm-bar-fill{height:100%;border-radius:2px;transition:width 0.6s cubic-bezier(0.16,1,0.3,1);position:relative;}
.tm-bar-fill::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.5),transparent);animation:shimmer 2.5s infinite;}
@keyframes shimmer{0%{transform:translateX(-100%);}100%{transform:translateX(100%);}}
.hp-high{background:linear-gradient(90deg,#15803d,#22c55e);}
.hp-mid{background:linear-gradient(90deg,#b45309,#f59e0b);}
.hp-low{background:linear-gradient(90deg,#b91c1c,#ef4444);}
.tm-hp-text{font-size:10px;color:var(--ink-4);margin-top:4px;letter-spacing:0.5px;font-variant-numeric:tabular-nums;}

.badges-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:24px;}
.badge{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:22px;border:1px solid var(--line);border-radius:10px;background:var(--paper-2);transition:all 0.4s cubic-bezier(0.16,1,0.3,1);}
.badge.owned{border-color:var(--accent);background:linear-gradient(135deg,rgba(194,65,12,0.08),rgba(234,88,12,0.04));}
.badge.owned:hover{transform:scale(1.1) rotate(5deg);}
.badge.locked{color:var(--line-2);opacity:0.4;}

.items-row{display:flex;flex-wrap:wrap;gap:6px;}
.item-chip{display:flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--line);border-radius:100px;font-size:11px;background:var(--paper-2);transition:all 0.2s;}
.item-chip:hover{border-color:var(--ink);}
.item-chip b{font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;font-size:12px;}

.actions{display:flex;gap:10px;flex-wrap:wrap;}
.btn{padding:14px 24px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);font-family:inherit;font-size:13px;font-weight:700;letter-spacing:0.5px;cursor:pointer;transition:all 0.2s ease;flex:1;min-width:120px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;position:relative;overflow:hidden;}
.btn::before{content:'';position:absolute;inset:0;background:var(--ink);transform:scaleY(0);transform-origin:bottom;transition:transform 0.3s cubic-bezier(0.16,1,0.3,1);z-index:0;}
.btn>*{position:relative;z-index:1;}
.btn:hover::before{transform:scaleY(1);}
.btn:hover{color:var(--paper);}
.btn:active{transform:scale(0.98);}
.btn:disabled{opacity:0.3;cursor:not-allowed;}
.btn-primary{background:var(--ink);color:var(--paper);}
.btn-primary::before{background:var(--accent);}
.btn-primary:hover{color:var(--paper);}
.btn-gold{border-color:var(--accent);color:var(--accent);}
.btn-gold::before{background:var(--accent);}
.btn-gold:hover{color:var(--paper);}
.btn-ghost{border-color:var(--line-2);color:var(--ink-3);}

.log{padding:22px 26px;background:var(--paper);border:1px solid var(--line);border-radius:16px;margin-top:16px;max-height:220px;overflow-y:auto;font-size:13px;line-height:2;color:var(--ink-2);}
.log::-webkit-scrollbar{width:3px;}
.log::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:2px;}
.log-entry{padding:3px 0;animation:fadeIn 0.3s ease;display:flex;gap:8px;align-items:flex-start;}
.log-entry::before{content:'·';color:var(--ink-4);flex-shrink:0;font-weight:900;}
.log-entry.highlight{color:var(--ink);font-weight:600;}
.log-entry.warn{color:var(--amber);}
.log-entry.danger{color:var(--red);}
.log-entry.good{color:var(--green);}
.log-entry.gold{color:var(--accent);font-weight:600;}

.battlefield{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
.combatant{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:28px 24px 22px;text-align:center;position:relative;overflow:hidden;}
.combatant.enemy{background:linear-gradient(180deg,rgba(185,28,28,0.02),var(--paper));}
.combatant.player{background:linear-gradient(180deg,rgba(194,65,12,0.03),var(--paper));}
.combatant::before{content:'';position:absolute;top:-40px;left:50%;width:200px;height:200px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,rgba(194,65,12,0.06),transparent 70%);pointer-events:none;}
.combatant.enemy::before{background:radial-gradient(circle,rgba(185,28,28,0.06),transparent 70%);}
.combatant-portrait{width:140px;height:140px;margin:0 auto 14px;position:relative;z-index:1;transition:transform 0.15s;}
.combatant-portrait.attack{animation:attackShake 0.4s ease;}
@keyframes attackShake{0%,100%{transform:translateX(0) rotate(0);}25%{transform:translateX(-14px) rotate(-8deg);}75%{transform:translateX(14px) rotate(8deg);}}
.combatant-portrait.hurt{animation:hurtFlash 0.5s ease;}
@keyframes hurtFlash{0%,100%{opacity:1;transform:translateX(0);}50%{opacity:0.3;transform:translateX(-10px) scale(0.95);filter:brightness(1.5);}}
.combatant-name{font-size:17px;font-weight:900;letter-spacing:1px;margin-bottom:4px;position:relative;z-index:1;}
.combatant-lv{font-size:10px;color:var(--ink-4);letter-spacing:1.5px;font-weight:700;margin-bottom:14px;font-variant-numeric:tabular-nums;position:relative;z-index:1;}
.hp-bar-big{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:8px;position:relative;z-index:1;}
.hp-bar-big-fill{height:100%;border-radius:3px;transition:width 0.6s cubic-bezier(0.16,1,0.3,1);}
.hp-numbers{font-size:11px;color:var(--ink-3);letter-spacing:1px;font-variant-numeric:tabular-nums;font-weight:600;position:relative;z-index:1;}
.status-tags{display:flex;justify-content:center;gap:4px;margin-top:8px;min-height:18px;position:relative;z-index:1;}
.status-tag{font-size:9px;font-weight:800;letter-spacing:1px;padding:2px 7px;border-radius:4px;text-transform:uppercase;}
.status-tag.atk-down{background:rgba(185,28,28,0.1);color:var(--red);}
.status-tag.def-down{background:rgba(180,83,9,0.1);color:var(--amber);}

.damage-float{position:absolute;top:35%;left:50%;transform:translateX(-50%);font-size:36px;font-weight:900;color:var(--red);pointer-events:none;animation:floatUp 1.1s cubic-bezier(0.16,1,0.3,1) forwards;z-index:10;letter-spacing:-1px;text-shadow:0 2px 8px rgba(0,0,0,0.1);}
@keyframes floatUp{0%{opacity:0;transform:translateX(-50%) translateY(20px) scale(0.5);}20%{opacity:1;transform:translateX(-50%) translateY(-10px) scale(1.2);}40%{transform:translateX(-50%) translateY(-20px) scale(1);}100%{opacity:0;transform:translateX(-50%) translateY(-70px) scale(1);}}
.damage-float.crit{color:var(--accent);font-size:44px;text-shadow:0 2px 12px rgba(194,65,12,0.3);}
.damage-float.heal{color:var(--green);}
.damage-float.miss{color:var(--ink-3);font-size:24px;font-weight:700;}

.skills-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px;}
.skill-btn{padding:16px 18px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-family:inherit;font-size:13px;font-weight:700;letter-spacing:0.3px;cursor:pointer;transition:all 0.25s cubic-bezier(0.16,1,0.3,1);text-align:left;display:flex;justify-content:space-between;align-items:center;gap:10px;border-radius:12px;position:relative;overflow:hidden;}
.skill-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(194,65,12,0.06),transparent);opacity:0;transition:opacity 0.25s;}
.skill-btn:hover:not(:disabled){border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,0.06);}
.skill-btn:hover:not(:disabled)::before{opacity:1;}
.skill-btn:active:not(:disabled){transform:translateY(0) scale(0.98);}
.skill-btn:disabled{opacity:0.35;cursor:not-allowed;}
.skill-info{display:flex;flex-direction:column;gap:2px;min-width:0;position:relative;z-index:1;}
.skill-name{font-size:13px;font-weight:700;}
.skill-meta{font-size:10px;color:var(--ink-4);letter-spacing:0.5px;font-weight:600;}
.skill-type-tag{font-size:9px;padding:3px 8px;border-radius:4px;font-weight:800;letter-spacing:1px;text-transform:uppercase;flex-shrink:0;color:#FFF;position:relative;z-index:1;}

.gym-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.gym-card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px 24px;display:flex;align-items:center;gap:16px;transition:all 0.3s cubic-bezier(0.16,1,0.3,1);position:relative;overflow:hidden;}
.gym-card.available{cursor:pointer;}
.gym-card.available::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);transform:scaleY(0);transform-origin:bottom;transition:transform 0.3s;}
.gym-card.available:hover{transform:translateY(-4px);border-color:var(--ink);box-shadow:0 12px 32px rgba(0,0,0,0.08);}
.gym-card.available:hover::before{transform:scaleY(1);}
.gym-card.locked{opacity:0.45;cursor:not-allowed;}
.gym-card.cleared{background:var(--paper-2);border-color:var(--line-2);}
.gym-icon{font-size:28px;flex-shrink:0;}
.gym-info{flex:1;min-width:0;}
.gym-name{font-size:14px;font-weight:900;letter-spacing:0.5px;margin-bottom:3px;}
.gym-lv{font-size:10px;color:var(--ink-4);letter-spacing:0.5px;font-weight:600;}
.gym-status{font-size:9px;letter-spacing:1.5px;font-weight:800;text-transform:uppercase;padding:4px 10px;border-radius:100px;flex-shrink:0;}
.status-clear{background:rgba(21,128,61,0.1);color:var(--green);}
.status-go{background:rgba(194,65,12,0.1);color:var(--accent);}
.status-lock{background:var(--line);color:var(--ink-4);}
.status-warn{background:rgba(185,28,28,0.1);color:var(--red);}

.ending{text-align:center;padding:72px 40px;background:var(--paper);border:1px solid var(--line);border-radius:20px;position:relative;overflow:hidden;}
.ending::before{content:'';position:absolute;top:-100px;left:50%;width:400px;height:400px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,rgba(194,65,12,0.08),transparent 70%);pointer-events:none;}
.ending-emoji{font-size:72px;margin-bottom:24px;display:block;animation:floatY 3s ease-in-out infinite;position:relative;}
.ending-title{font-size:36px;font-weight:900;letter-spacing:4px;margin-bottom:20px;color:var(--ink);position:relative;}
.ending-desc{font-size:14px;color:var(--ink-3);line-height:2;max-width:480px;margin:0 auto 40px;position:relative;}
.ending-stats{display:flex;justify-content:center;gap:48px;margin:40px 0;flex-wrap:wrap;position:relative;}
.ending-stat{text-align:center;}
.ending-stat-num{font-size:32px;font-weight:900;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-1px;}
.ending-stat-label{font-size:9px;color:var(--ink-4);letter-spacing:2px;margin-top:8px;text-transform:uppercase;font-weight:700;}

.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:var(--ink);color:var(--paper);padding:14px 24px;border-radius:12px;font-size:13px;font-weight:600;z-index:999;box-shadow:0 12px 32px rgba(0,0,0,0.2);transition:transform 0.4s cubic-bezier(0.16,1,0.3,1);}
.toast.show{transform:translateX(-50%) translateY(0);}

/* ===== 升级弹窗 ===== */
.levelup-modal{position:fixed;inset:0;z-index:1000;background:rgba(26,24,21,0.65);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;visibility:hidden;transition:opacity 0.3s,visibility 0.3s;}
.levelup-modal.show{opacity:1;visibility:visible;}
.levelup-panel{background:var(--paper);border-radius:20px;width:100%;max-width:420px;padding:36px 32px 28px;text-align:center;transform:scale(0.9) translateY(20px);transition:transform 0.4s cubic-bezier(0.16,1,0.3,1);position:relative;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,0.3);}
.levelup-modal.show .levelup-panel{transform:scale(1) translateY(0);}
.levelup-panel::before{content:'';position:absolute;top:-80px;left:50%;transform:translateX(-50%);width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(194,65,12,0.15),transparent 70%);pointer-events:none;}
.levelup-tag{font-size:10px;letter-spacing:5px;color:var(--accent);font-weight:800;text-transform:uppercase;margin-bottom:14px;position:relative;}
.levelup-portrait{width:120px;height:120px;margin:0 auto 12px;position:relative;animation:floatY 3s ease-in-out infinite;}
.levelup-name{font-size:24px;font-weight:900;letter-spacing:1px;margin-bottom:4px;position:relative;}
.levelup-lv-text{font-size:13px;color:var(--ink-3);margin-bottom:24px;position:relative;font-weight:600;}
.levelup-lv-text b{color:var(--accent);font-size:18px;font-weight:900;}
.levelup-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px;position:relative;}
.levelup-stat{background:var(--paper-2);border:1px solid var(--line);border-radius:12px;padding:12px 8px;position:relative;overflow:hidden;}
.levelup-stat .k{font-size:9px;color:var(--ink-4);letter-spacing:2px;text-transform:uppercase;font-weight:700;margin-bottom:4px;}
.levelup-stat .v{font-size:18px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--ink);line-height:1.1;}
.levelup-stat .up{font-size:11px;color:var(--green);font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;}
.levelup-stat .up.new{color:var(--accent);}
.levelup-btn{padding:13px 24px;border:none;border-radius:10px;background:var(--ink);color:var(--paper);font-family:inherit;font-size:13px;font-weight:700;letter-spacing:0.5px;cursor:pointer;width:100%;transition:all 0.2s;position:relative;}
.levelup-btn:hover{background:var(--accent);transform:translateY(-1px);}

/* ===== 进化弹窗 ===== */
.evolve-modal{position:fixed;inset:0;z-index:1001;background:rgba(26,24,21,0.75);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;visibility:hidden;transition:opacity 0.4s,visibility 0.4s;}
.evolve-modal.show{opacity:1;visibility:visible;}
.evolve-panel{background:var(--paper);border-radius:24px;width:100%;max-width:460px;padding:44px 32px 32px;text-align:center;transform:scale(0.85);transition:transform 0.5s cubic-bezier(0.16,1,0.3,1);position:relative;overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,0.4);}
.evolve-modal.show .evolve-panel{transform:scale(1);}
.evolve-panel::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,rgba(194,65,12,0.18),transparent 60%);pointer-events:none;}
.evolve-tag{font-size:10px;letter-spacing:6px;color:var(--accent);font-weight:800;text-transform:uppercase;margin-bottom:20px;position:relative;}
.evolve-row{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:24px;position:relative;}
.evolve-portrait{width:110px;height:110px;position:relative;}
.evolve-portrait.old{opacity:0.5;animation:evolveShakeOld 1s ease forwards;}
.evolve-portrait.new{animation:evolveShakeNew 1s ease 0.3s forwards;opacity:0;}
@keyframes evolveShakeOld{0%,100%{opacity:0.5;transform:scale(1);}50%{opacity:0.15;transform:scale(0.9);}100%{opacity:0;transform:scale(0.5);}}
@keyframes evolveShakeNew{0%{opacity:0;transform:scale(0.5);}60%{opacity:1;transform:scale(1.15);}100%{opacity:1;transform:scale(1);}}
.evolve-arrow{font-size:28px;color:var(--accent);font-weight:900;animation:arrowPulse 1.2s ease-in-out infinite;}
@keyframes arrowPulse{0%,100%{transform:translateX(0);}50%{transform:translateX(6px);}}
.evolve-title{font-size:22px;font-weight:900;margin-bottom:8px;position:relative;}
.evolve-title em{color:var(--accent);font-style:normal;}
.evolve-sub{font-size:13px;color:var(--ink-3);margin-bottom:26px;position:relative;}
.evolve-btn{padding:13px 24px;border:none;border-radius:10px;background:var(--ink);color:var(--paper);font-family:inherit;font-size:13px;font-weight:700;letter-spacing:0.5px;cursor:pointer;width:100%;transition:all 0.2s;position:relative;}
.evolve-btn:hover{background:var(--accent);transform:translateY(-1px);}

@media (max-width:640px){
  .app{padding:20px 16px 60px;}
  .hero{padding:32px 0 24px;}
  .hero h1{font-size:32px;letter-spacing:2px;}
  .starter-grid{grid-template-columns:1fr;}
  .main-grid{grid-template-columns:1fr;}
  .battlefield{grid-template-columns:1fr;}
  .gym-grid{grid-template-columns:1fr;}
  .skills-grid{grid-template-columns:1fr;}
  .actions{flex-direction:column;}
  .btn{min-width:unset;}
  .panel{padding:20px;}
  .topbar{flex-direction:column;gap:12px;align-items:flex-start;}
  .topbar-stats{width:100%;justify-content:space-between;}
  .combatant-portrait{width:110px;height:110px;}
  .starter-portrait{width:100px;height:100px;}
  .levelup-panel{padding:28px 22px 22px;}
  .evolve-row{gap:8px;}
  .evolve-portrait{width:85px;height:85px;}
}
</style>

    </div>
    <div class="starter-section">

  <div class="screen" id="screen-main">

      <div class="panel">

      <div class="panel">

    <div class="panel">

        <button class="btn btn-ghost" onclick="quickTrain()">⚡ 快速练级</button>

        <button class="btn btn-ghost" onclick="restTao()">😴 休息</button>
      </div>
    </div>
    <div class="log" id="log"></div>
  </div>

  <div class="screen" id="screen-gyms">

        <button class="btn btn-ghost" onclick="switchScreen('screen-main')">← 返回</button>
      </div>
    </div>
  </div>

  <div class="screen" id="screen-battle">
    <div class="battlefield">
      <div class="combatant enemy" id="enemy-box">
        <div class="combatant-portrait" id="enemy-portrait"></div>
        <div class="combatant-name" id="enemy-name">???</div>
        <div class="combatant-lv" id="enemy-lv">Lv.? · ???</div>
        <div class="hp-bar-big"><div class="hp-bar-big-fill" id="enemy-hp-fill" style="width:100%"></div></div>
        <div class="hp-numbers" id="enemy-hp-text">-- / --</div>
        <div class="status-tags" id="enemy-status"></div>
      </div>
      <div class="combatant player" id="player-box">
        <div class="combatant-portrait" id="player-portrait"></div>
        <div class="combatant-name" id="player-name">???</div>
        <div class="combatant-lv" id="player-lv">Lv.? · ???</div>
        <div class="hp-bar-big"><div class="hp-bar-big-fill" id="player-hp-fill" style="width:100%"></div></div>
        <div class="hp-numbers" id="player-hp-text">-- / --</div>
        <div class="status-tags" id="player-status"></div>

    </div>
    <div class="panel" style="padding:20px;">

      <div class="actions" id="battle-actions"></div>
    </div>
    <div class="log" id="battle-log"></div>
  </div>

  <div class="screen" id="screen-ending">
    <div class="ending">
      <div class="ending-emoji" id="ending-emoji">🏆</div>
      <div class="ending-title" id="ending-title">冠军</div>
      <div class="ending-desc" id="ending-desc"></div>
      <div class="ending-stats" id="ending-stats"></div>
      <div class="actions" style="justify-content:center;border:none;padding:0;">
        <button class="btn btn-primary" onclick="location.reload()" style="max-width:240px;">重新开始</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- 升级弹窗 -->
  <div class="levelup-modal" id="levelupModal">
    <div class="levelup-panel">
      <div class="levelup-tag">Level Up</div>
      <div class="levelup-portrait" id="levelup-portrait"></div>
      <div class="levelup-name" id="levelup-name"></div>

      <div class="levelup-stats" id="levelup-stats"></div>
      <button class="levelup-btn" onclick="closeLevelup()">继续</button>
    </div>
  </div>

  <!-- 进化弹窗 -->

      <button class="evolve-btn" onclick="closeEvolve()">太棒了！</button>
    </div>
  </div>

</div>

  if(!fn) return `<svg viewBox="0 0 100 100" width="${size}" height="${size}"><circle cx="50" cy="50" r="30" fill="#DDD" stroke="#1A1815" stroke-width="2"/></svg>`;
  return fn(size);
}

function weightedChoice(arr){
  const t = arr.reduce((s,x)=>s+x.weight,0);
  let r = Math.random()*t;
  for(const it of arr){r-=it.weight;if(r<=0)return it;}
  return arr[arr.length-1];
}

/* ========== 计算属性 ========== */
function calcStats(id, level){
  const b = POKEDEX[id];
  if(!b) return {maxHp:1, atk:1, def:1, spd:1};
  return {
    maxHp: Math.floor(b.baseHp*2 + level*6 + 20),
    atk: Math.floor(b.baseAtk + level*2.5),
    def: Math.floor(b.baseDef + level*2.5),
    spd: Math.floor(b.baseSpd + level*2.5),
  };
}

function createPokemon(id, level){
  const b = POKEDEX[id];
  if(!b) return null;
  level = level || 5;
  const s = calcStats(id, level);
  const p = {
    id, name:b.name, type:b.type, level, exp:0,
    maxHp:s.maxHp, atk:s.atk, def:s.def, spd:s.spd,
    skills:b.skills.map(k=>({id:k,...SKILLS[k],curPp:SKILLS[k].pp})),
    evolveLv:b.evolveLv, evolvesTo:b.evolvesTo, catchRate:b.catchRate,
    status:{atkDown:0,defDown:0}
  };
  p.hp = s.maxHp;
  return p;
}

/* ========== 升级（带弹窗） ========== */
function levelUp(p){
  const oldStats = {maxHp:p.maxHp, atk:p.atk, def:p.def, spd:p.spd};
  p.level++;
  const b = POKEDEX[p.id];
  const ns = calcStats(p.id, p.level);
  p.maxHp = ns.maxHp; p.atk = ns.atk; p.def = ns.def; p.spd = ns.spd;
  p.hp = p.maxHp;

  addLog(`⬆ ${p.name} 升至 Lv.${p.level}`, 'good');

  // 学新技能
  let learned = null;
  if(p.level % 8 === 0){
    const pool = learnableSkills(p.id);
    const learn = pool.find(sid => !p.skills.find(s=>s.id===sid));
    if(learn && p.skills.length < 4){
      p.skills.push({id:learn,...SKILLS[learn],curPp:SKILLS[learn].pp});
      learned = SKILLS[learn].name;
      addLog(`✨ ${p.name} 学会了「${learned}」`, 'gold');
    }
  }

  // 弹出升级面板
  showLevelup(p, oldStats, learned);
}

function learnableSkills(id){
  const map = {
    charmander:['flamewheel'], charmeleon:['flamethrower'],
    squirtle:['bubble'], wartortle:['surf'],
    bulbasaur:['razorleaf'], ivysaur:['solarbeam'],
    pikachu:['thunderbolt'], pidgey:['wingattack'],
    pidgeotto:['headbutt'], rattata:['headbutt'],
    growlithe:['flamewheel'], abra:['psychic'],
    dratini:['dragonclaw'], dragonair:['wingattack'],
    oddish:['razorleaf'], caterpie:['bugbite'],
    metapod:['bugbite'], zubat:['wingattack'],
  };
  return map[id] || [];
}

function evolve(p){
  const oldName = p.name;
  const oldId = p.id;
  const nid = p.evolvesTo;
  const b = POKEDEX[nid];
  if(!b) return;
  p.id = nid; p.name = b.name; p.type = b.type;
  p.evolveLv = b.evolveLv; p.evolvesTo = b.evolvesTo;
  p.catchRate = b.catchRate;
  const ns = calcStats(nid, p.level);
  p.maxHp = ns.maxHp; p.atk = ns.atk; p.def = ns.def; p.spd = ns.spd;
  p.hp = p.maxHp;
  p.skills = b.skills.map(k=>({id:k,...SKILLS[k],curPp:SKILLS[k].pp}));
  addLog(`✨ 「${oldName}」进化为了「${p.name}」！`, 'gold');
  showEvolve(oldId, nid, oldName, b.name);
}

function gainExp(p, amt){
  if(!p) return;
  p.exp += amt;
  let need = p.level * p.level * 3;
  let guard = 0;
  while(p.exp >= need && guard < 20){
    p.exp -= need;
    levelUp(p);
    need = p.level * p.level * 3;
    guard++;
  }
}

/* ========== 升级弹窗 UI ========== */
let levelupQueue = [];
let levelupShowing = false;

function showLevelup(p, oldStats, learned){
  levelupQueue.push({p, oldStats, learned});
  if(!levelupShowing) processLevelupQueue();
}

function processLevelupQueue(){
  if(levelupQueue.length === 0){
    levelupShowing = false;
    return;
  }
  levelupShowing = true;
  const {p, oldStats, learned} = levelupQueue.shift();

  document.getElementById('levelup-portrait').innerHTML = portrait(p.id, 120);
  document.getElementById('levelup-name').textContent = p.name;
  document.getElementById('levelup-lv').textContent = p.level;

  const rows = [
    {k:'HP', v:p.maxHp, old:oldStats.maxHp, unit:''},
    {k:'攻击', v:p.atk, old:oldStats.atk, unit:''},
    {k:'防御', v:p.def, old:oldStats.def, unit:''},
    {k:'速度', v:p.spd, old:oldStats.spd, unit:''},
  ];
  document.getElementById('levelup-stats').innerHTML = rows.map(r=>{
    const diff = r.v - r.old;
    return `<div class="levelup-stat">
      <div class="k">${r.k}</div>
      <div class="v">${r.v}</div>
      <div class="up${diff>0?'':''}">${diff>0?'+'+diff:''}</div>
    </div>`;
  }).join('');

  if(learned){
    // 在按钮上方加一行提示
    const btn = document.querySelector('#levelupModal .levelup-btn');
    let tip = document.getElementById('levelup-learned-tip');
    if(!tip){
      tip = document.createElement('div');
      tip.id = 'levelup-learned-tip';
      tip.style.cssText = 'font-size:12px;color:#c2410c;font-weight:700;margin-bottom:14px;position:relative;';
      btn.parentNode.insertBefore(tip, btn);
    }
    tip.textContent = `✨ 学会了新技能：${learned}`;
  } else {
    const tip = document.getElementById('levelup-learned-tip');
    if(tip) tip.remove();
  }

  document.getElementById('levelupModal').classList.add('show');
}

function closeLevelup(){
  document.getElementById('levelupModal').classList.remove('show');
  setTimeout(()=>processLevelupQueue(), 200);
}

function explore(){

  if(state.tao.stamina < 10){
    showToast('潘涛太累了，先休息一下');
    addLog('潘涛太累了，需要休息。', 'danger');
    return;
  }
  state.tao.stamina = clamp(state.tao.stamina - rand(3,6), 0, 100);

  const r = Math.random();
  if(r < 0.5) startWildBattle();
  else if(r < 0.65){
    const item = choice(['potion','ball','superball']);
    state.items[item]++;
    const names = {potion:'伤药',ball:'精灵球',superball:'超级球'};

    state.tao.mood = clamp(state.tao.mood+2, 0, 100);
    renderMain();
  }
  else if(r < 0.78) startTrainerBattle();
  else if(r < 0.88){
    const m = rand(50,200);
    state.money += m;
    addLog(`💰 潘涛拾得 ${m} 金币`, 'gold');
    renderMain();
  }
  else if(r < 0.96){

    const ev = choice(events);
    addLog('✨ '+ev.text, 'gold');
    if(ev.mood) state.tao.mood = clamp(state.tao.mood+ev.mood, 0, 100);
    if(ev.stamina) state.tao.stamina = clamp(state.tao.stamina+ev.stamina, 0, 100);
    if(ev.rep) state.tao.reputation = clamp(state.tao.reputation+ev.rep, 0, 100);
    renderMain();
  }
}

function restTao(){
  state.tao.stamina = clamp(state.tao.stamina+30, 0, 100);
  state.tao.mood = clamp(state.tao.mood+20, 0, 100);
  state.team.forEach(p=>{p.hp = Math.min(p.maxHp, p.hp + Math.floor(p.maxHp*0.5));});
  state.team.forEach(p=>p.skills.forEach(s=>s.curPp = Math.min(s.pp, s.curPp+10)));
  addLog('😴 潘涛在宝可梦中心休息，体力恢复，队伍回血。', 'good');
  showToast('休息完成');
  renderMain();
}

function quickTrain(){
  if(state.tao.stamina < 15){
    showToast('体力不足，先休息一下');
    return;
  }
  const teamMaxLv = Math.max(...state.team.map(p => p.level), 5);
  state.tao.stamina = clamp(state.tao.stamina - 15, 0, 100);

  state.team.forEach(p => {
    if(p.hp > 0){
      const exp = p.level * p.level * 2 + 40;
      gainExp(p, exp);
    }
  });

  addLog(`⚡ 潘涛在训练场特训，全队获得大量经验！`, 'gold');
  showToast('特训完成！');
  renderMain();
}

function usePotion(){
  if(state.items.potion <= 0){
    showToast('没有伤药了');
    addLog('没有伤药了。', 'danger');
    return;
  }
  const injured = state.team.filter(p=>p.hp < p.maxHp && p.hp > 0);
  if(injured.length === 0){
    showToast('队伍状态良好');
    addLog('队伍状态良好。', '');
    return;
  }
  const t = injured.reduce((a,b)=>a.hp/a.maxHp < b.hp/b.maxHp ? a : b);
  const h = Math.floor(t.maxHp*0.5);
  t.hp = Math.min(t.maxHp, t.hp+h);
  state.items.potion--;
  addLog(`潘涛对「${t.name}」使用伤药，恢复 ${h} 点 HP。`, 'good');
  showToast(`${t.name} 恢复 ${h} HP`);
  renderMain();
}

/* ========== 战斗 ========== */
function startWildBattle(){
  const e = weightedChoice(WILD_POOL);
  const teamMaxLv = Math.max(...state.team.map(p=>p.level), 5);
  const lv = clamp(rand(Math.max(e.minLv, teamMaxLv-2), teamMaxLv+2), e.minLv, e.maxLv);
  state.currentEnemy = createPokemon(e.id, lv);
  state.battleType = 'wild';
  state.playerTurn = true;
  state.combo = 0;
  state.lastSkill = null;
  openBattle();
}
function startTrainerBattle(){
  const pool = ['pidgeotto','growlithe','eevee','abra','golbat','raticate','butterfree'];
  const teamMaxLv = Math.max(...state.team.map(p=>p.level), 5);
  const lv = clamp(rand(teamMaxLv-1, teamMaxLv+2), 8, 40);
  state.currentEnemy = createPokemon(choice(pool), lv);
  state.battleType = 'trainer';
  state.playerTurn = true;
  state.combo = 0;
  state.lastSkill = null;
  openBattle();
}
function startGymBattle(i){
  const g = GYMS[i];
  const valid = POKEDEX[g.pokemon] ? g.pokemon : 'onix';
  const e = createPokemon(valid, g.lv);

  // 前两个道馆削弱
  if(g.id <= 2){
    e.maxHp = Math.floor(e.maxHp * 0.8);
    e.hp = e.maxHp;
    e.atk = Math.floor(e.atk * 0.7);
  } else if(g.id <= 4){
    e.maxHp = Math.floor(e.maxHp * 0.9);
    e.hp = e.maxHp;
    e.atk = Math.floor(e.atk * 0.85);
  }

  state.currentEnemy = e;
  state.battleType = 'gym';
  state.gymIndex = i;
  state.playerTurn = true;
  state.combo = 0;
  state.lastSkill = null;

  const teamMaxLv = Math.max(...state.team.map(p => p.level), 5);
  if(teamMaxLv < g.lv - 4){
    addLog(`⚠ 馆主 ${g.leader} 的宝可梦 Lv.${g.lv}，你最高 Lv.${teamMaxLv}，建议先练级！`, 'danger');
  }

  openBattle();
}
function openBattle(){

  document.getElementById('battle-log').innerHTML = '';
  if(state.battleType === 'wild') addBattleLog(`野生的「${state.currentEnemy.name}」（Lv.${state.currentEnemy.level}）出现了。`, 'highlight');
  else if(state.battleType === 'trainer') addBattleLog(`训练家派出了「${state.currentEnemy.name}」（Lv.${state.currentEnemy.level}）。`, 'warn');
  else {
    const g = GYMS[state.gymIndex];
    addBattleLog(`${g.name} 馆主 ${g.leader} 派出了「${state.currentEnemy.name}」（Lv.${state.currentEnemy.level}）。`, 'gold');
  }
  const p = getActivePokemon();
  addBattleLog(`潘涛派出了「${p.name}」。`, 'highlight');

}
function getActivePokemon(){
  return state.team.find(p=>p.hp > 0) || state.team[0];
}

function renderBattle(){
  const e = state.currentEnemy, p = getActivePokemon();
  if(!e || !p) return;

  document.getElementById('enemy-portrait').innerHTML = portrait(e.id, 140);
  document.getElementById('enemy-name').textContent = e.name;
  document.getElementById('enemy-lv').textContent = `Lv.${e.level} · ${e.type}`;
  const ep = (e.hp/e.maxHp)*100;
  const ef = document.getElementById('enemy-hp-fill');
  ef.style.width = ep + '%';
  ef.style.background = ep > 50 ? 'linear-gradient(90deg,#15803d,#22c55e)' : ep > 20 ? 'linear-gradient(90deg,#b45309,#f59e0b)' : 'linear-gradient(90deg,#b91c1c,#ef4444)';
  document.getElementById('enemy-hp-text').textContent = `${Math.max(0,e.hp)} / ${e.maxHp}`;
  document.getElementById('enemy-status').innerHTML = renderStatusTags(e);

  document.getElementById('player-portrait').innerHTML = portrait(p.id, 140);
  document.getElementById('player-name').textContent = p.name;
  document.getElementById('player-lv').textContent = `Lv.${p.level} · ${p.type}`;
  const pp = (p.hp/p.maxHp)*100;
  const pf = document.getElementById('player-hp-fill');
  pf.style.width = pp + '%';
  pf.style.background = pp > 50 ? 'linear-gradient(90deg,#15803d,#22c55e)' : pp > 20 ? 'linear-gradient(90deg,#b45309,#f59e0b)' : 'linear-gradient(90deg,#b91c1c,#ef4444)';
  document.getElementById('player-hp-text').textContent = `${Math.max(0,p.hp)} / ${p.maxHp}`;
  document.getElementById('player-status').innerHTML = renderStatusTags(p);

  document.getElementById('skills-grid').innerHTML = p.skills.map((s,i)=>
    `<button class="skill-btn" onclick="useSkill(${i})" ${state.playerTurn && s.curPp > 0 ? '' : 'disabled'}>
      <div class="skill-info">
        <div class="skill-name">${s.name}</div>
        <div class="skill-meta">${s.curPp}/${s.pp} PP · 威力 ${s.power||'—'}</div>
      </div>
      <span class="skill-type-tag" style="background:${TYPE_COLORS[s.type]}">${s.type}</span>
    </button>`).join('');

  const actions = document.getElementById('battle-actions');
  let html = '';
  if(state.battleType === 'wild'){
    html += `<button class="btn btn-gold" onclick="throwBall()" ${state.playerTurn ? '' : 'disabled'}>⚪ 扔球 (${state.items.ball + state.items.superball})</button>`;
    html += `<button class="btn btn-ghost" onclick="fleeBattle()" ${state.playerTurn ? '' : 'disabled'}>🏃 逃跑</button>`;
  }
  html += `<button class="btn btn-ghost" onclick="useBattlePotion()" ${state.playerTurn ? '' : 'disabled'}>🧪 伤药 (${state.items.potion})</button>`;
  actions.innerHTML = html;

function renderStatusTags(p){
  let html = '';
  if(p.status){
    if(p.status.atkDown > 0) html += '<span class="status-tag atk-down">ATK↓</span>';
    if(p.status.defDown > 0) html += '<span class="status-tag def-down">DEF↓</span>';
  }
  return html;
}

/* ========== 伤害公式（修复版） ========== */
function calcDamage(a, d, skill){
  if(skill.power === 0) return {damage:0, crit:false, multiplier:1, miss:false};
  if(Math.random() < 0.08) return {damage:0, crit:false, multiplier:1, miss:true};
  const chart = TYPE_CHART[skill.type] || {};
  const m = chart[d.type] !== undefined ? chart[d.type] : 1;
  if(m === 0) return {damage:0, crit:false, multiplier:0, miss:false};

  const levelBonus = clamp(1 + (a.level - d.level) * 0.03, 0.4, 1.6);
  let base = (a.atk * 0.9 + skill.power * 1.1) * m * levelBonus;
  base *= 0.85 + Math.random() * 0.15;

  const crit = Math.random() < 0.08;
  if(crit) base *= 1.6;

  // 防御按比例削减，最多减 40%
  const defReduce = Math.min(0.4, d.def / (d.def + a.atk * 1.5));
  base *= (1 - defReduce);

  base = Math.max(3, Math.floor(base));
  return {damage:base, crit, multiplier:m, miss:false};
}
function typeText(m){
  if(m === 0) return {text:'没有效果',cls:'danger'};
  if(m >= 2) return {text:'效果绝佳！',cls:'gold'};
  if(m <= 0.5) return {text:'效果不佳…',cls:'warn'};
  return null;
}

function useSkill(i){
  if(!state.playerTurn) return;
  const p = getActivePokemon(), e = state.currentEnemy, s = p.skills[i];
  if(s.curPp <= 0){addBattleLog(`「${s.name}」没有 PP 了。`, 'danger'); return;}
  state.playerTurn = false;
  s.curPp--;
  renderBattle();

  const pe = document.getElementById('player-portrait');
  pe.classList.add('attack');
  setTimeout(()=>pe.classList.remove('attack'), 400);
  addBattleLog(`潘涛的「${p.name}」使用了 ${s.name}。`, 'highlight');

  if(state.lastSkill === s.name) state.combo++;
  else {state.combo = 1; state.lastSkill = s.name;}

  if(s.power === 0){
    if(s.effect === 'atkdown'){
      e.atk = Math.max(10, Math.floor(e.atk*0.85));
      e.status.atkDown = 1;
      addBattleLog(`「${e.name}」的攻击下降了。`, 'warn');
    } else if(s.effect === 'defdown'){
      e.def = Math.max(5, Math.floor(e.def*0.85));
      e.status.defDown = 1;
      addBattleLog(`「${e.name}」的防御下降了。`, 'warn');
    }
    renderBattle();
    setTimeout(enemyTurn, 800);
    return;
  }

  const r = calcDamage(p, e, s);
  setTimeout(()=>{
    if(r.miss){
      showFloat('enemy-box', 'MISS', 'miss');
      addBattleLog(`可惜，没有命中。`, 'warn');
      renderBattle();
      setTimeout(enemyTurn, 800);
      return;
    }
    if(r.damage === 0){
      addBattleLog(`对「${e.name}」没有效果。`, 'danger');
      renderBattle();
      setTimeout(enemyTurn, 800);
      return;
    }
    let dmg = r.damage;
    if(state.combo >= 2) dmg = Math.floor(dmg * (1 + 0.15*(state.combo-1)));
    e.hp = Math.max(0, e.hp - dmg);
    showFloat('enemy-box', '-'+dmg, r.crit ? 'crit' : '');
    const ee = document.getElementById('enemy-portrait');
    ee.classList.add('hurt');
    setTimeout(()=>ee.classList.remove('hurt'), 400);

    if(r.crit) addBattleLog(`💥 暴击！造成 ${dmg} 点伤害！`, 'gold');
    else addBattleLog(`造成 ${dmg} 点伤害。`, '');
    if(state.combo >= 2) addBattleLog(`🔥 连击 x${state.combo}！`, 'gold');
    const tt = typeText(r.multiplier);
    if(tt) addBattleLog(tt.text, tt.cls);
    renderBattle();
    if(e.hp <= 0) setTimeout(winBattle, 700);
    else setTimeout(enemyTurn, 800);
  }, 350);
}

function enemyTurn(){
  const e = state.currentEnemy, p = getActivePokemon();
  if(!e || e.hp <= 0 || !p || p.hp <= 0) return;

  let s = e.skills.reduce((a,b) => a.power > b.power ? a : b);
  if(s.curPp <= 0){
    const usable = e.skills.find(x => x.curPp > 0);
    if(usable) s = usable;
    else {state.playerTurn = true; renderBattle(); return;}
  }
  s.curPp--;

  const ee = document.getElementById('enemy-portrait');
  ee.classList.add('attack');
  setTimeout(()=>ee.classList.remove('attack'), 400);
  addBattleLog(`「${e.name}」使用了 ${s.name}。`, 'warn');

  if(s.power === 0){
    if(s.effect === 'atkdown'){
      p.atk = Math.max(10, Math.floor(p.atk*0.85));
      p.status.atkDown = 1;
      addBattleLog(`「${p.name}」的攻击下降了。`, 'warn');
    } else if(s.effect === 'defdown'){
      p.def = Math.max(5, Math.floor(p.def*0.85));
      p.status.defDown = 1;
      addBattleLog(`「${p.name}」的防御下降了。`, 'warn');
    }
    state.playerTurn = true;
    renderBattle();
    return;
  }

  const r = calcDamage(e, p, s);
  setTimeout(()=>{
    if(r.miss){
      showFloat('player-box', 'MISS', 'miss');
      addBattleLog(`「${p.name}」闪开了！`, 'good');
      state.playerTurn = true;
      renderBattle();
      return;
    }
    if(r.damage === 0){
      addBattleLog(`对「${p.name}」没有效果。`, 'danger');
      state.playerTurn = true;
      renderBattle();
      return;
    }
    p.hp = Math.max(0, p.hp - r.damage);
    showFloat('player-box', '-'+r.damage, r.crit ? 'crit' : '');
    const pe = document.getElementById('player-portrait');
    pe.classList.add('hurt');
    setTimeout(()=>pe.classList.remove('hurt'), 400);
    if(r.crit) addBattleLog(`💥 暴击！造成 ${r.damage} 点伤害。`, 'gold');
    else addBattleLog(`造成 ${r.damage} 点伤害。`, '');
    renderBattle();
    if(p.hp <= 0) setTimeout(handleFaint, 700);
    else {state.playerTurn = true; renderBattle();}
  }, 350);
}

function showFloat(id, text, cls){
  const box = document.getElementById(id);
  if(!box) return;
  const el = document.createElement('div');
  el.className = 'damage-float ' + (cls||'');
  el.textContent = text;
  box.appendChild(el);
  setTimeout(()=>el.remove(), 1100);
}

function winBattle(){
  const e = state.currentEnemy, p = getActivePokemon();
  addBattleLog(`「${e.name}」倒下了。`, 'good');
  const exp = Math.floor(e.level * 12 + 15);
  addBattleLog(`「${p.name}」获得 ${exp} 点经验。`, 'good');
  gainExp(p, exp);
  state.team.forEach(pk=>{
    if(pk !== p && pk.hp > 0) gainExp(pk, Math.floor(exp*0.5));
  });

  let money = e.level * 10 + 30;
  if(state.battleType === 'trainer') money *= 1.5;
  if(state.battleType === 'gym') money *= 2;
  money = Math.floor(money);
  state.money += money;
  addBattleLog(`获得 ${money} 金币。`, 'gold');

  if(state.battleType === 'trainer'){
    state.tao.reputation = clamp(state.tao.reputation+3, 0, 100);
    state.tao.mood = clamp(state.tao.mood+3, 0, 100);
  }
  if(state.battleType === 'gym'){
    state.tao.reputation = clamp(state.tao.reputation+8, 0, 100);
  }

  if(state.battleType === 'gym'){
    const g = GYMS[state.gymIndex];
    state.badges = Math.max(state.badges, g.id);
    state.money += g.reward;
    addBattleLog(`获得「${g.name}」徽章！`, 'gold');
    addBattleLog(`额外获得 ${g.reward} 金币。`, 'gold');
    showToast(`获得 ${g.name} 徽章！`);
  }

  state.team.forEach(pk=>pk.skills.forEach(s=>{s.curPp = Math.min(s.pp, s.curPp+5);}));

  if(state.badges >= 8 && state.battleType === 'gym'){
    setTimeout(()=>{switchScreen('screen-ending'); showEnding();}, 1400);
    return;
  }
  renderMain();
  setTimeout(()=>{
    state.currentEnemy = null;
    state.battleType = null;
    switchScreen('screen-main');
    renderMain();
  }, 1400);
}

function handleFaint(){
  const p = getActivePokemon();
  addBattleLog(`「${p.name}」倒下了。`, 'danger');
  const alive = state.team.filter(x=>x.hp > 0);
  if(alive.length > 0){
    addBattleLog(`潘涛换上了「${alive[0].name}」。`, 'highlight');
    state.playerTurn = true;
    renderBattle();
  } else {
    addBattleLog('潘涛的队伍全灭了…', 'danger');
    setTimeout(()=>{
      state.team.forEach(x=>{x.hp = Math.floor(x.maxHp*0.5);});
      state.money = Math.max(0, state.money-500);
      state.tao.mood = clamp(state.tao.mood-10, 0, 100);
      state.tao.stamina = clamp(state.tao.stamina-10, 0, 100);
      addBattleLog('潘涛被送回宝可梦中心，损失 500 金币。', 'warn');
      showToast('队伍全灭，返回中心');
      state.currentEnemy = null;
      state.battleType = null;
      switchScreen('screen-main');
      renderMain();
    }, 1600);
  }
}

function throwBall(){
  if(!state.playerTurn) return;
  const e = state.currentEnemy;
  let bt = 'ball', bn = '精灵球', bm = 1;
  if(state.items.superball > 0){bt = 'superball'; bn = '超级球'; bm = 1.5;}
  if(state.items[bt] <= 0){addBattleLog('没有精灵球了。', 'danger'); return;}
  state.items[bt]--;
  state.playerTurn = false;
  renderBattle();
  addBattleLog(`潘涛扔出了「${bn}」。`, 'highlight');
  const hpF = 1 - (e.hp/e.maxHp)*0.7;
  const lvF = 1 - Math.min(0.5, e.level/100);
  const rate = clamp((e.catchRate/100)*hpF*lvF*bm, 0.03, 0.95);
  const roll = Math.random();
  setTimeout(()=>{
    if(roll < rate){
      addBattleLog(`🎉 成功捕捉「${e.name}」！`, 'gold');
      const np = createPokemon(e.id, e.level);
      np.hp = e.hp;
      if(state.team.length < 6){
        state.team.push(np);
        addBattleLog(`「${e.name}」加入了队伍。`, 'good');
      } else {
        addBattleLog(`队伍已满，「${e.name}」被传送至电脑。`, 'warn');
      }
      state.caught++;
      state.tao.mood = clamp(state.tao.mood+5, 0, 100);
      state.tao.reputation = clamp(state.tao.reputation+2, 0, 100);
      showToast(`捕捉 ${e.name} 成功！`);
      state.currentEnemy = null;
      state.battleType = null;
      setTimeout(()=>{switchScreen('screen-main'); renderMain();}, 1300);
    } else {
      addBattleLog(`「${e.name}」挣脱了！`, 'danger');
      setTimeout(enemyTurn, 500);
    }
  }, 400);
}

function useBattlePotion(){
  if(!state.playerTurn) return;
  if(state.items.potion <= 0){addBattleLog('没有伤药了。', 'danger'); return;}
  const p = getActivePokemon();
  if(p.hp >= p.maxHp){addBattleLog(`「${p.name}」状态良好。`, ''); return;}
  state.items.potion--;
  const h = Math.floor(p.maxHp*0.5);
  p.hp = Math.min(p.maxHp, p.hp+h);
  showFloat('player-box', '+'+h, 'heal');
  addBattleLog(`潘涛对「${p.name}」使用了伤药，恢复 ${h} 点 HP。`, 'good');
  state.playerTurn = false;
  renderBattle();
  setTimeout(enemyTurn, 800);
}

function fleeBattle(){
  if(!state.playerTurn) return;
  if(state.battleType === 'gym' || state.battleType === 'trainer'){
    addBattleLog('训练家对战中无法逃跑。', 'danger');
    return;
  }
  const p = getActivePokemon(), e = state.currentEnemy;
  if(Math.random() < 0.5 + (p.spd-e.spd)/200){
    addBattleLog('潘涛成功逃走了。', 'warn');
    state.tao.mood = clamp(state.tao.mood-2, 0, 100);
    state.currentEnemy = null;
    state.battleType = null;
    setTimeout(()=>{switchScreen('screen-main'); renderMain();}, 700);
  } else {
    addBattleLog('没能逃掉。', 'danger');
    state.playerTurn = false;
    renderBattle();
    setTimeout(enemyTurn, 800);
  }
}

function showGyms(){
  const teamMaxLv = Math.max(...state.team.map(p => p.level), 5);

  document.getElementById('gym-grid').innerHTML = GYMS.map((g,i)=>{
    const cleared = state.badges >= g.id;
    const available = state.badges >= g.id-1;
    let cls = 'locked', status = '<span class="gym-status status-lock">未解锁</span>';

    if(cleared){
      cls = 'cleared';
      status = '<span class="gym-status status-clear">已通过</span>';
    } else if(available){
      if(teamMaxLv < g.lv - 4){
        cls = 'available';
        status = '<span class="gym-status status-warn">等级不足</span>';
      } else if(teamMaxLv < g.lv){
        cls = 'available';
        status = '<span class="gym-status status-go">可挑战⚠</span>';
      } else {
        cls = 'available';
        status = '<span class="gym-status status-go">可挑战</span>';
      }
    }
    const click = available && !cleared ? `onclick="challengeGym(${i})"` : '';
    return `<div class="gym-card ${cls}" ${click}>
      <span class="gym-icon">${g.icon}</span>
      <div class="gym-info">
        <div class="gym-name">${g.name}</div>
        <div class="gym-lv">馆主 ${g.leader} · Lv.${g.lv} · 你 Lv.${teamMaxLv}</div>
      </div>
      ${status}
    </div>`;
  }).join('');
  switchScreen('screen-gyms');
}
function challengeGym(i){
  const g = GYMS[i];
  addLog(`潘涛进入「${g.name}」。`, 'gold');
  startGymBattle(i);
}

function showEnding(){
  document.getElementById('ending-emoji').textContent = '🏆';
  document.getElementById('ending-title').textContent = '冠军';
  document.getElementById('ending-desc').textContent = '潘涛集齐八枚徽章，击败所有馆主，站在了冠军的领奖台上。这一刻，所有的疲惫都值得。';
  document.getElementById('ending-stats').innerHTML = `
    <div class="ending-stat"><div class="ending-stat-num">${state.badges}</div><div class="ending-stat-label">徽章</div></div>
    <div class="ending-stat"><div class="ending-stat-num">${state.caught}</div><div class="ending-stat-label">捕获</div></div>
    <div class="ending-stat"><div class="ending-stat-num">${state.money}</div><div class="ending-stat-label">金币</div></div>
    <div class="ending-stat"><div class="ending-stat-num">${state.tao.reputation}</div><div class="ending-stat-label">声望</div></div>`;
}

renderStarters();
